[workspace]
resolver = "3"

[package]
name = "razen-runner-fixtures"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[[bin]]
name = "razen-tool-supervisor"
path = "src/bin/razen-tool-supervisor.rs"

[[bin]]
name = "razen-sandbox-adversary"
path = "src/bin/razen-sandbox-adversary.rs"

[dependencies]
libc = "=0.2.191"
seccompiler = "=0.5.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
sha2 = "=0.11.1"
hex = "=0.4.3"
jiff = { version = "=1.0.1", default-features = false, features = ["std"] }
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }

[lints.clippy]
undocumented_unsafe_blocks = "deny"
