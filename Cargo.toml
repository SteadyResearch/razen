[workspace]
members = ["crates/engine"]
exclude = ["fixtures/components", "fixtures/linux-runner"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.dependencies]
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
hex = { version = "=0.4.3", default-features = false, features = ["alloc"] }
ipnet = { version = "=2.12.2", features = ["serde"] }
rama = { version = "=0.4.0", default-features = false, features = ["http-backend", "tcp", "dns", "rustls", "ring"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
rusqlite = { version = "=0.43.0", features = ["bundled", "hooks"] }
rustix = { version = "=1.1.6", default-features = false, features = ["std", "fs", "process", "time"] }
subtle = { version = "=2.6.1", default-features = false, features = ["std"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
sha2 = "=0.11.1"
spdx = { version = "=0.13.6", default-features = false }
jiff = { version = "=1.0.1", default-features = false, features = ["std"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "net", "sync", "signal"] }
toml_edit = { version = "=0.25.19", default-features = false, features = ["parse"] }
url = { version = "=2.5.8", features = ["serde"] }
uuid = { version = "=1.29.3", features = ["v4", "serde"] }
wasmtime = { version = "=50.0.2", default-features = false, features = ["std", "runtime", "cranelift", "component-model", "async"] }
wasmtime-wasi = { version = "=50.0.2", default-features = false, features = ["p2"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

# Keep full image-integrity hashing practical during bounded debug/test worker startup.
[profile.dev.package.sha2]
opt-level = 3
